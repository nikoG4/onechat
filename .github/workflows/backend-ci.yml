name: OneChat backend - Ktor and PostgreSQL integration
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onechat
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: onechat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onechat -d onechat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: PostgreSQL 16 integration tests and server distribution
        env:
          ONECHAT_TEST_DB_URL: jdbc:postgresql://localhost:5432/onechat_test
          ONECHAT_TEST_DB_USER: onechat
          ONECHAT_TEST_DB_PASSWORD: test_only
        run: gradle -p backend test installDist --console=plain --no-daemon --stacktrace
