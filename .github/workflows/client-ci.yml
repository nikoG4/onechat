name: OneChat client - AdaptiveKT from Maven Central
on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/client-ci.yml']
  pull_request:
    paths: ['client/**', '.github/workflows/client-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kmp-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 35
        run: |
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Kotlin Multiplatform Android Desktop Wasm and tests
        run: |
          gradle -p client compileKotlinDesktop compileDebugKotlinAndroid compileKotlinWasmJs desktopTest --console=plain --no-daemon --stacktrace
