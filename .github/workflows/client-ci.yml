name: OneChat client - Android APK, Desktop, WebAssembly and API contract
on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/client-ci.yml']
  pull_request:
    paths: ['client/**', '.github/workflows/client-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kmp-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 35
        run: |
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify API contract, UI targets and create Android APK
        run: |
          gradle -p client compileKotlinDesktop compileDebugKotlinAndroid compileKotlinWasmJs desktopTest assembleDebug --console=plain --no-daemon --stacktrace
      - name: Upload Android preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OneChat-Android-debug-APK
          path: client/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          echo 'OneChat real Ktor client (Android, Desktop, wasmJs) and Maven Central AdaptiveKT.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Android APK published only when compilation and tests succeed.' >> "$GITHUB_STEP_SUMMARY"
