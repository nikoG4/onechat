<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <!-- Firebase (MVP auth for wasm/web) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script>
      window.firebaseSignInWithGoogle = async function () {
        const firebaseConfig = {
          apiKey: "AIzaSyCYi5t7Imq-AsSqb33cfEJvSEu2wZ4H2A4",
          authDomain: "proyecto-26ba8.firebaseapp.com",
          projectId: "proyecto-26ba8",
          storageBucket: "proyecto-26ba8.firebasestorage.app",
          messagingSenderId: "685406200923",
          appId: "1:685406200923:web:237ad0c0b2dc0da72c0b7e",
          measurementId: "G-Y05QFY0JDQ"
        };

        // Evita inicializar varias veces.
        if (!window._firebaseApp) {
          window._firebaseApp = firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        if (!user) throw new Error("No se pudo obtener el usuario de Firebase");
        return await user.getIdToken();
      };
    </script>
    <script type="application/javascript" src="composeApp.js"></script>
