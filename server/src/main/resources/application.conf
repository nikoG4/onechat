ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }

    application {
        modules = [ com.chat.ApplicationKt.module ]
    }

    database {
        url = "jdbc:postgresql://localhost:5432/chat"
        url = ${?DATABASE_URL}
        driver = "org.postgresql.Driver"
        user = "postgres"
        user = ${?DATABASE_USER}
        password = "admin"
        password = ${?DATABASE_PASSWORD}
    }

    oauth {
        google {
            clientId = ${?GOOGLE_CLIENT_ID}
            clientSecret = ${?GOOGLE_CLIENT_SECRET}
        }
    }

    jwt {
        secret = ${?JWT_SECRET:"chat-secret-key-change-in-production"}
        issuer = "chat-app"
        audience = "chat-users"
        realm = "Chat App"
    }
}
