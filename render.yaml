# OneChat preview: Render Free Ktor server + external Neon Free PostgreSQL.
# All secrets are entered in Render; do not commit credentials.
services:
  - type: web
    name: onechat-preview-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: ONECHAT_DATABASE_URL
        sync: false
      - key: ONECHAT_DB_USER
        sync: false
      - key: ONECHAT_DB_PASSWORD
        sync: false
      - key: ONECHAT_JWT_SECRET
        generateValue: true
      - key: ONECHAT_INVITE_CODE
        sync: false
      - key: ONECHAT_ALLOWED_ORIGINS
        value: ""
